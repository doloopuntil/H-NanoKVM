[package]
name = "kvm-system"
version = "0.1.0"
edition = "2024"
publish = false
description = "Prototype: kvm_system (OLED, button, Wi-Fi setup) in Rust"

[dependencies]
qrcodegen = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
