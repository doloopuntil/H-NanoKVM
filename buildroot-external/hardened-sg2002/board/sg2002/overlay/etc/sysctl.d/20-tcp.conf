# MJPEG has no flow control of its own: a 16 KiB unsent threshold makes the
# server wait before stale frames pile up in the socket (NanoKVM-OS measured
# 167 KiB to 2 KiB queued, same frame rate). Not a hard cap.
net.ipv4.tcp_notsent_lowat = 16384
# Keep the congestion window of a connection that paused between requests.
net.ipv4.tcp_slow_start_after_idle = 0
