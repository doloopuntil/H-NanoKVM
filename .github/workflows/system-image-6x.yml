name: H-NanoKVM system image (Linux 6.18)

# Manual only: builds one Buildroot tree with Linux 6.18, the Sophgo media modules, the FIPs,
# U-Boot and the rootfs, and with its toolchain the middleware and libkvm_mmf; then the SD
# image and an unsigned system-update archive. Multi-hour; do not run it on every push.
on:
  workflow_dispatch: {}

concurrency:
  group: sg2002-image-build-6x
  cancel-in-progress: false

env:
  BUILDROOT_VERSION: "2026.05.1"
  RUST_VERSION: "1.99.0"
  # sophgo/fsbl sg200x-dev, weekly release 2026-11-06.
  SOPHGO_FSBL_SHA: 5a80c127cf614dea7f534d5b5352886a1c720d37
  # One Sophgo weekly release (2026-08-24) for every video kernel module and middleware library,
  # and the sensor list (enum and names) that release's sample code reads.
  SOPHGO_OSDRV_SHA: 1b3a49649d18488ecf54fb4fcb6c27599e433fdc
  SOPHGO_CVI_MPI_SHA: 693a72a1d52f2e08ea767e0a72905e81f10572a5
  SOPHGO_SENSOR_LIST_SHA: e2824e1d07f516c41238e123fefbab71a34843bc
  LICHEERV_EXTERNAL_SHA: 019ffc864bb9353f823afc98f7dd9fdacfa935cb

jobs:
  # The long part: Buildroot without its post-image step. Its handoff artifact lets
  # assemble-image be rerun on its own in minutes. Buildroot's toolchain is built first: the
  # same GCC and musl build the Sophgo middleware and libkvm_mmf and link the server.
  build-buildroot:
    runs-on: ubuntu-24.04
    # 360 minutes is the hard cap on GitHub-hosted runners.
    timeout-minutes: 360
    env:
      RUN_ROOT: ${{ github.workspace }}/build/rc12-run
      EXPECTED_SYSTEM_VERSION: 1.0.0
      EXPECTED_KVMAPP_VERSION: 3.0.0
      EXPECTED_KERNEL_RELEASE: 6.18.29
      EXPECTED_SECURITY_PATCH_LEVEL: Buildroot 2026.05.1 security maintenance Linux 6.18.29
      NANOKVM_KVMAPP_SOURCE_DIR: ${{ github.workspace }}/build/kvmapp-rust/kvmapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip rsync bc cpio \
            libncurses-dev python3 perl bison flex device-tree-compiler \
            dosfstools mtools file libssl-dev pkg-config e2fsprogs \
            u-boot-tools zstd xz-utils util-linux cmake patch

      # Pinned: the runner's moving `stable` changed the link behaviour once already.
      - name: Install Rust ${{ env.RUST_VERSION }} with the riscv64gc-unknown-linux-musl target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target riscv64gc-unknown-linux-musl
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Buildroot source download
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: buildroot-${{ env.BUILDROOT_VERSION }}

      # Restored here and saved at the end even when the build fails, so a rerun downloads and
      # compiles mostly from cache.
      - name: Restore the Buildroot package downloads
        uses: actions/cache/restore@v4
        with:
          path: build/buildroot-package-dl-cache
          key: buildroot-6x-dl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: buildroot-6x-dl-

      - name: Restore the Buildroot compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: buildroot-6x-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: buildroot-6x-ccache-

      - name: Bootstrap Buildroot + security-patched source
        run: |
          mkdir -p build/buildroot-package-dl-cache
          make latest-buildroot-bootstrap
          BUILDROOT_SECURITY_DL_DIR="${{ github.workspace }}/build/buildroot-package-dl-cache" \
            make latest-buildroot-security-source

      # licheerv's external tree (board patches, FSBL patches) and the FSBL source for the FIPs.
      - name: Fetch the licheerv external tree and the FSBL source
        run: |
          LICHEERV_EXTERNAL_SHA="$LICHEERV_EXTERNAL_SHA" scripts/fetch-licheerv-external.sh
          SOPHGO_FSBL_SHA="$SOPHGO_FSBL_SHA" scripts/fetch-sg2002-boot-source.sh

      # The middleware, the uapi headers of the same Sophgo release, and the sensor list.
      - name: Fetch the Sophgo middleware source
        run: |
          sparse_fetch() {
            dir="$1" url="$2" sha="$3"
            shift 3
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" sparse-checkout set --no-cone "$@"
            git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            [ "$(git -C "$dir" rev-parse HEAD)" = "$sha" ]
          }
          sparse_fetch "$RUNNER_TEMP/cvi_mpi" https://github.com/sophgo/cvi_mpi.git \
            "$SOPHGO_CVI_MPI_SHA" \
            /Makefile.param /include/ /sample/common/ /component/panel/cv181x/ \
            /modules/sys/ /modules/venc/ /modules/vdec/ /modules/vi/ /modules/vpss/ /modules/vo/ \
            /modules/gdc/ /modules/rgn/ /modules/bin/include/ /modules/isp/include/cv181x/ \
            /modules/ive/include/ /3rdparty/inih/
          sparse_fetch "$RUNNER_TEMP/osdrv-uapi" https://github.com/sophgo/osdrv.git \
            "$SOPHGO_OSDRV_SHA" /interdrv/include/
          sparse_fetch "$RUNNER_TEMP/sensor-list" https://github.com/sophgo/SensorSupportList.git \
            "$SOPHGO_SENSOR_LIST_SHA" /common/
          patch -d "$RUNNER_TEMP/cvi_mpi" -p1 --forward --fuzz=0 \
            < support/sg2002/middleware-patches/cvi-mpi-693a72a-no-vi-dbg-thread.patch
          ! grep -q vi_dbg_handler "$RUNNER_TEMP/cvi_mpi/modules/vi/src/cvi_vi.c"
          patch -d "$RUNNER_TEMP/cvi_mpi" -p1 --forward --fuzz=0 \
            < support/sg2002/middleware-patches/cvi-mpi-693a72a-map-through-cvi-sys.patch
          ! grep -q '"/dev/mem"' "$RUNNER_TEMP/cvi_mpi/modules/sys/src/devmem.c"
          patch -d "$RUNNER_TEMP/cvi_mpi" -p1 --forward --fuzz=0 \
            < support/sg2002/middleware-patches/cvi-mpi-693a72a-venc-persistent-pack-mappings.patch
          grep -q VENC_MAP_WINDOWS "$RUNNER_TEMP/cvi_mpi/modules/venc/src/cvi_venc.c"
          patch -d "$RUNNER_TEMP/cvi_mpi" -p1 --forward --fuzz=0 \
            < support/sg2002/middleware-patches/cvi-mpi-693a72a-no-devmem-commands.patch
          ! grep -q 'system("devmem' "$RUNNER_TEMP/cvi_mpi/modules/sys/src/cvi_sys.c"

      - name: Build Buildroot's cross-compiler and musl
        run: |
          HARDENED_SG2002_6X_OUTPUT_DIR="$RUN_ROOT/buildroot" \
            scripts/build-buildroot-6x-image.sh toolchain
          echo "CROSS_PREFIX=$RUN_ROOT/buildroot/host/bin/riscv64-buildroot-linux-musl-" >> "$GITHUB_ENV"

      # libsys/libvenc/libvdec/libvi/libvpss/libvo/libgdc/librgn/libini: libkvm_mmf.so links
      # against these and the image ships them.
      - name: Build the Sophgo middleware from source
        run: |
          SDK_MIDDLEWARE_OPT_FLAGS=-O2 scripts/build-sdk-middleware.sh "$RUNNER_TEMP/cvi_mpi" \
            "$RUNNER_TEMP/osdrv-uapi" \
            "$GITHUB_WORKSPACE/build/native-libkvm/middleware" "$CROSS_PREFIX"

      # kvm_mmf compiles against these headers and sample code, so they match the libraries above.
      - name: Stage the headers and sample code for libkvm_mmf
        run: |
          scripts/stage-sg2002-sdk.sh "$RUNNER_TEMP/cvi_mpi" "$RUNNER_TEMP/osdrv-uapi" \
            "$RUNNER_TEMP/sensor-list" \
            "$GITHUB_WORKSPACE/build/native-libkvm/middleware" "$RUNNER_TEMP/sg2002-sdk"

      # Plain CMake (support/sg2002/CMakeLists.txt) with Buildroot's GCC: scalar xthead, stack
      # protector, full RELRO.
      # The script also checks SSP, RPATH, the loader and libkvm_mmf's exports.
      - name: Build libkvm_mmf.so
        run: |
          # The sources must carry the native changes this image relies on.
          grep -q "no stale sys state to release" support/sg2002/additional/kvm_mmf/src/kvm_mmf.cpp
          grep -q "mmf_vi_frame_release" support/sg2002/additional/kvm_mmf/src/kvm_mmf.cpp
          grep -q 'extern "C"' support/sg2002/additional/kvm_mmf/include/kvm_mmf.hpp
          scripts/build-sg2002-native.sh "$CROSS_PREFIX" "$RUNNER_TEMP/sg2002-sdk" \
            "$GITHUB_WORKSPACE/build/native-libkvm"
          file build/native-libkvm/libkvm_mmf.so

      # The server links against the same musl it runs on.
      - name: Stage the server's link-time sysroot from Buildroot
        run: |
          SYSROOT=$("${CROSS_PREFIX}gcc" -print-sysroot)
          mkdir -p server-rust/sysroot/lib
          cp "$SYSROOT/lib/libc.so" "$SYSROOT/lib/libgcc_s.so.1" server-rust/sysroot/lib/
          cp -R "$SYSROOT/usr/include" server-rust/sysroot/include

      # dl_lib is not in git: the server links against and packages this run's builds only.
      - name: Use freshly-built libkvm_mmf.so and middleware
        run: |
          mkdir -p server-rust/native/dl_lib
          cp build/native-libkvm/libkvm_mmf.so server-rust/native/dl_lib/libkvm_mmf.so
          for lib in libsys.so libvenc.so libvdec.so libvi.so libvpss.so libvo.so libgdc.so librgn.so \
            libini.so; do
            cp "build/native-libkvm/middleware/$lib" "server-rust/native/dl_lib/$lib"
          done

      # build.rs assembles the XTheadVector TLS code with Buildroot's GNU binutils.
      - name: Build Hardened kvmapp bridge
        run: |
          cargo test --manifest-path server-rust/Cargo.toml
          corepack pnpm --dir web install --frozen-lockfile
          corepack pnpm --dir web build
          NANOKVM_XTHEADVECTOR_PREFIX="$CROSS_PREFIX" server-rust/scripts/build-linked-libkvm.sh
          grep -q "Poly1305 for RISC-V, CRYPTOGAMS" \
            server-rust/target/riscv64gc-unknown-linux-musl/release/nanokvm-rust-server
          RUST_TARGET=riscv64gc-unknown-linux-musl \
            APP_VERSION="$(cat kvmapp/version)" \
            scripts/package-rust-kvmapp.sh

      - name: Build the kernel, media modules, FIPs and rootfs with Buildroot
        run: |
          HARDENED_SG2002_6X_OUTPUT_DIR="$RUN_ROOT/buildroot" \
          HARDENED_SG2002_6X_REPORT_DIR="$RUN_ROOT/_reports/build" \
          HNANOKVM_6X_HANDOFF="$RUN_ROOT/buildroot-6x-handoff.tar.zst" \
            scripts/build-buildroot-6x-image.sh build
          df -h /

      - name: Upload the native build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-libkvm-build
          path: build/native-libkvm/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the Buildroot handoff for assemble-image
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-6x-handoff
          path: build/rc12-run/buildroot-6x-handoff.tar.zst
          retention-days: 7
          if-no-files-found: error

      - name: Upload Buildroot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-6x-diagnostics
          path: |
            build/rc12-run/buildroot/.config
            build/rc12-run/buildroot/build/*/config.log
            build/rc12-run/buildroot/build/linux-*/.config
            build/rc12-run/_reports/**
          retention-days: 7
          if-no-files-found: warn

      - name: Save the Buildroot compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: buildroot-6x-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the Buildroot package downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/buildroot-package-dl-cache
          key: buildroot-6x-dl-${{ github.run_id }}-${{ github.run_attempt }}

  # post-image.sh (boot.vfat with the FIT, the SD image), the boot checks and packaging, from
  # the handoff alone.
  assemble-image:
    needs: [build-buildroot]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUN_ROOT: ${{ github.workspace }}/build/rc12-run
      EXPECTED_SYSTEM_VERSION: 1.0.0
      EXPECTED_KVMAPP_VERSION: 3.0.0
      EXPECTED_KERNEL_RELEASE: 6.18.29
      EXPECTED_SECURITY_PATCH_LEVEL: Buildroot 2026.05.1 security maintenance Linux 6.18.29
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools e2fsprogs util-linux xz-utils zstd openssl

      - name: Download the Buildroot handoff
        uses: actions/download-artifact@v4
        with:
          name: buildroot-6x-handoff
          path: ${{ runner.temp }}/handoff

      # Same absolute path as in build-buildroot: Buildroot's host tools carry it in their RPATH.
      - name: Unpack the Buildroot handoff
        run: |
          mkdir -p "$RUN_ROOT/buildroot"
          zstd -dc "$RUNNER_TEMP/handoff/buildroot-6x-handoff.tar.zst" | tar -xf - -C "$RUN_ROOT/buildroot"

      - name: Assemble the boot partition and the SD image
        run: |
          HARDENED_SG2002_6X_OUTPUT_DIR="$RUN_ROOT/buildroot" \
          HARDENED_SG2002_6X_REPORT_DIR="$RUN_ROOT/_reports/image" \
            scripts/build-buildroot-6x-image.sh assemble

      # The unsigned raw update archive, plus the script that signs it with a local key.
      - name: Package the unsigned system-update archive
        run: |
          SYSTEM_VERSION="${EXPECTED_SYSTEM_VERSION%.*}.${{ github.run_number }}" \
          KERNEL_VERSION="$EXPECTED_KERNEL_RELEASE" \
          SECURITY_PATCH_LEVEL="$EXPECTED_SECURITY_PATCH_LEVEL" \
          BUILDROOT_VERSION="$BUILDROOT_VERSION" \
          REQUIRED_APP_VERSION=2.0.41 \
            scripts/package-local-system-update.sh \
            "$RUN_ROOT/buildroot/images/hardened-sg2002-6x.img" \
            "$RUN_ROOT/system-update"

      - name: Compress the SD image
        run: |
          mkdir -p "$RUN_ROOT/sd-image"
          xz -T0 -6 -c "$RUN_ROOT/buildroot/images/hardened-sg2002-6x.img" \
            > "$RUN_ROOT/sd-image/hardened-sg2002-6x.img.xz"
          (cd "$RUN_ROOT/sd-image" && sha256sum hardened-sg2002-6x.img.xz > SHA256SUMS)

      - name: Upload the system-update archive
        uses: actions/upload-artifact@v4
        with:
          name: system-update-archive-6x
          path: build/rc12-run/system-update/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload the SD image and reports
        uses: actions/upload-artifact@v4
        with:
          name: sg2002-6x-sd-image
          path: |
            build/rc12-run/sd-image/**
            build/rc12-run/_reports/**
          retention-days: 14
          if-no-files-found: error
