name: H-NanoKVM system image

# Manual only: this rebuilds the vendor SDK, a from-scratch Buildroot toolchain, the hardened
# 5.10.265 kernel/modules, and the SG2002 rootfs. It is multi-hour and disk-heavy; do not run it on
# every push.
on:
  workflow_dispatch: {}

concurrency:
  group: sg2002-image-build
  cancel-in-progress: false

env:
  BUILDROOT_VERSION: "2026.05.1"
  RUST_VERSION: "1.99.0"
  LICHEERV_NANO_SDK_SHA: d88d58feca49ef15f4cc7bd1f27dbf17dc25f85e
  # One Sophgo weekly release (2024-10-14) for every video kernel module and middleware library,
  # and the sensor list (enum and names) that release's sample code reads.
  SOPHGO_OSDRV_SHA: 28215f2d37b108de7a29ed26006878135749c886
  SOPHGO_CVI_MPI_SHA: ebaaf1bf46a6ff77d2ce3e6fa3e7673fc1d71dda
  SOPHGO_SENSOR_LIST_SHA: 7e900fc6caf002dd37c995b425f8892c5080d49e
  # Pinned in scripts/rehydrate-vendor-kernel-5.10.265-merge.sh, verified against the canonical
  # git.kernel.org stable tree's peeled tag commits.
  STABLE_5_10_4_COMMIT: b1313fe517ca3703119dcc99ef3bbf75ab42bcfb
  STABLE_5_10_265_COMMIT: 2a3da1f4966798b0b48ce302944ad356b2c98b5d
  # Real upstream (GPL-3.0, sipeed/NanoKVM): source for the 4 OpenCV modules libkvm.so needs
  # (verified near-byte-identical; see server-rust/native/README.md).
  NANOKVM_UPSTREAM_COMMIT: bd070b2f5ce27d22618e8a1c8d2bdca543429882
  NANOKVM_UPSTREAM_OPENCV_CORE_SHA256: fc4ffdd709d2241e7392bb0f6f7ade1a5b1dbbefe5b5551dd2f5ae5ec11ff566
  NANOKVM_UPSTREAM_OPENCV_HIGHGUI_SHA256: 77ac57b3f652d3df598f89dcbebabb61a31a5794933d4fe703e2875fa83f261f
  NANOKVM_UPSTREAM_OPENCV_IMGCODECS_SHA256: 4ffc0253a75c47374ba5400d5ba3687c072943c99f83774150b4b800f00029c0
  NANOKVM_UPSTREAM_OPENCV_IMGPROC_SHA256: b01ee9a078c25fbe80aae6ebc5d3da52eebbbef2cb51362808d1d5fe139abff1
  # libkvm.so/libkvm_mmf.so build inputs. libkvm_mmf.so statically compiles in a whole separate,
  # frozen copy of the LT6911 sensor driver -- the vendor-sdk-stock patch above never reaches the
  # code that actually runs; see server-rust/native/README.md.
  MAIXCDK_SHA: 5b0aa5b1a8c91d213433189cfab8c999775fa13a

jobs:
  # Just the two pinned checkouts (SDK, host-tools) plus the tracked patch. The kernel and module
  # jobs need nothing the stock build produces, so they start from this and run alongside it.
  vendor-sdk-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zstd

      - name: Bootstrap vendor SDK
        run: make vendor-sdk

      # lt6911_sensor_ctl.c's chip-ID I2C probe never succeeds on this board (confirmed on real
      # hardware); HDMI works without it, so it's removed. fsbl-overdrive-clocks selects the
      # FSBL's overdrive clock table (C906 1050 MHz, VDDC 1.00 V). fsbl-boot-guard counts boots that
      # never reached a healthy system in RTC_INFO1: the FSBL arms the top watchdog, falls back to the
      # standard clocks after 2 such boots and leaves the watchdog off after 4.
      - name: Apply tracked vendor SDK patches
        run: |
          for patch in lt6911-sensor-id-probe-removed fsbl-overdrive-clocks fsbl-boot-guard; do
            file="$GITHUB_WORKSPACE/buildroot-external/hardened-sg2002/board/sg2002/vendor-sdk-patches/$patch.patch"
            git -C build/vendor/LicheeRV-Nano-Build apply --check "$file"
            git -C build/vendor/LicheeRV-Nano-Build apply "$file"
          done

      # Tarred because artifacts drop file permissions and symlinks.
      - name: Package vendor SDK source
        run: |
          mkdir -p "$RUNNER_TEMP/vendor-sdk-source"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/vendor-sdk-source/vendor-sdk-source.tar.zst" \
            -C build vendor
          ls -l "$RUNNER_TEMP/vendor-sdk-source"

      - name: Upload vendor SDK source
        uses: actions/upload-artifact@v4
        with:
          name: vendor-sdk-source
          path: ${{ runner.temp }}/vendor-sdk-source/vendor-sdk-source.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  # Isolated: the most expensive, most fragile stage (~14 GiB, long compile). Hands build-image
  # only the files it reads, small enough to cache, so a cache hit skips the stock build.
  vendor-sdk:
    needs: [vendor-sdk-source]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bump the version when the stock build changes in a way the hashed files do not show.
      - name: Restore the stock vendor SDK handoff
        id: stock-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vendor-sdk/vendor-sdk.tar.zst
          key: vendor-sdk-stock-v1-${{ env.LICHEERV_NANO_SDK_SHA }}-${{ hashFiles('scripts/bootstrap-vendor-sdk.sh', 'scripts/build-vendor-sdk-stock.sh', 'buildroot-external/hardened-sg2002/board/sg2002/vendor-sdk-patches/**') }}

      - name: Install host build dependencies
        if: steps.stock-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip rsync bc cpio \
            libncurses-dev python3 perl bison flex device-tree-compiler \
            dosfstools mtools file libssl-dev pkg-config e2fsprogs zstd

      - name: Download vendor SDK source
        if: steps.stock-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: vendor-sdk-source
          path: ${{ runner.temp }}/vendor-sdk-source

      - name: Unpack vendor SDK source
        if: steps.stock-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          tar -I zstd -xf "$RUNNER_TEMP/vendor-sdk-source/vendor-sdk-source.tar.zst" -C build
          rm -f "$RUNNER_TEMP/vendor-sdk-source/vendor-sdk-source.tar.zst"
          test -d build/vendor/LicheeRV-Nano-Build/.git

      - name: Build stock vendor SDK image
        if: steps.stock-cache.outputs.cache-hit != 'true'
        run: make vendor-sdk-stock

      # Only what build-image reads: the stock rootfs.sd (runtime files), boot.sd, fip.bin (standard
      # clocks) and fip.od.bin (overdrive),
      # the ramdisk inputs and keys for the boot FIT, the vendor mkimage with the host/ libraries
      # it loads, and the boot logo. Tarred because artifacts drop permissions and symlinks.
      - name: Package vendor SDK for build-image
        if: steps.stock-cache.outputs.cache-hit != 'true'
        run: |
          SDK=vendor/LicheeRV-Nano-Build
          OUT=$SDK/install/soc_sg2002_licheervnano_sd
          MKIMAGE=$SDK/build/tools/common/prebuild/mkimage
          set -- \
            "$OUT/rawimages/rootfs.sd" \
            "$OUT/rawimages/boot.sd" \
            "$OUT/fip.bin" \
            "$OUT/fip.od.bin" \
            "$SDK/ramdisk/build/sg2002_licheervnano_sd/workspace/boot.cpio" \
            "$SDK/ramdisk/build/sg2002_licheervnano_sd/workspace/multi.its" \
            "$SDK/ramdisk/keys" \
            "$MKIMAGE" \
            "$SDK/build/tools/common/sd_tools/logo.jpeg"
          cd build
          for path in "$@"; do
            test -e "$path" || { echo "missing from the stock build: $path" >&2; exit 1; }
          done
          du -sh "$SDK/host" || true
          for lib in $(LD_LIBRARY_PATH="$PWD/$SDK/host" ldd "$MKIMAGE" | awk '{ print $3 }' | grep "^$PWD/$SDK/host/" || true); do
            set -- "$@" "${lib#"$PWD/"}"
          done
          printf '%s\n' "$@"
          mkdir -p "$RUNNER_TEMP/vendor-sdk"
          tar -h -I 'zstd -T0 -10' -cf "$RUNNER_TEMP/vendor-sdk/vendor-sdk.tar.zst" "$@"
          ls -l "$RUNNER_TEMP/vendor-sdk"

      - name: Save the stock vendor SDK handoff
        if: steps.stock-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vendor-sdk/vendor-sdk.tar.zst
          key: ${{ steps.stock-cache.outputs.cache-primary-key }}

      - name: Upload vendor SDK
        uses: actions/upload-artifact@v4
        with:
          name: vendor-sdk
          path: ${{ runner.temp }}/vendor-sdk/vendor-sdk.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Isolated, independent of vendor-sdk: one toolchain (MaixCDK's pinned Xuantie musl gcc) builds
  # the SDK middleware, libkvm.so/libkvm_mmf.so and kvm_system from source.
  # libkvm_mmf.so statically compiles in its own frozen copy of the LT6911 sensor driver (see
  # server-rust/native/README.md) -- the vendor-sdk-stock patch above never reaches the code that
  # actually runs; this is the job that does.
  build-native-libkvm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git curl python3 python3-venv python3-pip \
            autoconf automake libtool patchelf patch file

      - name: Fetch MaixCDK
        run: |
          mkdir -p "$HOME/MaixCDK"
          git -C "$HOME/MaixCDK" init -q
          git -C "$HOME/MaixCDK" remote add origin https://github.com/sipeed/MaixCDK.git
          git -C "$HOME/MaixCDK" fetch --depth 1 origin "$MAIXCDK_SHA"
          git -C "$HOME/MaixCDK" checkout -q FETCH_HEAD
          python3 -m venv "$HOME/MaixCDK"
          "$HOME/MaixCDK/bin/pip" install -U -r "$HOME/MaixCDK/requirements.txt"
          echo "$HOME/MaixCDK/bin" >> "$GITHUB_PATH"

      # Same source as vendor-sdk-stock's own copy, so the same patch applies. Embedded paths
      # differ between the two trees, so target the file directly with `patch` instead of `git
      # apply`.
      - name: Apply the LT6911 sensor-id-probe-removed patch to MaixCDK's vendored copy
        run: |
          LT6911_FILE="$HOME/MaixCDK/components/3rd_party/sophgo-middleware/sophgo-middleware/v2/component/isp/sensor/sg200x/lontium_lt6911/lt6911_sensor_ctl.c"
          patch --fuzz=0 --forward -p1 -o /tmp/lt6911_sensor_ctl.c.patched "$LT6911_FILE" \
            < "$GITHUB_WORKSPACE/buildroot-external/hardened-sg2002/board/sg2002/vendor-sdk-patches/lt6911-sensor-id-probe-removed.patch"
          cp /tmp/lt6911_sensor_ctl.c.patched "$LT6911_FILE"
          ! grep -q "LT6911_CHIP_ID_ADDR_H)" "$LT6911_FILE"

      # Nothing we ship needs XTheadVector: build for the scalar xthead multilib and loader.
      - name: Build MaixCDK projects without the vector extension
        run: |
          YAML="$HOME/MaixCDK/platforms/maixcam.yaml"
          sed -i 's/-mcpu=c906fdv -march=rv64imafdcv0p7xthead/-mcpu=c906fd -march=rv64imafdcxthead/g' "$YAML"
          ! grep -q v0p7 "$YAML"

      # The middleware, the uapi headers of the same Sophgo release, and our kernel's ION uapi.
      - name: Fetch the Sophgo middleware source
        run: |
          sparse_fetch() {
            dir="$1" url="$2" sha="$3"
            shift 3
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" sparse-checkout set --no-cone "$@"
            git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            [ "$(git -C "$dir" rev-parse HEAD)" = "$sha" ]
          }
          sparse_fetch "$RUNNER_TEMP/cvi_mpi" https://github.com/sophgo/cvi_mpi.git \
            "$SOPHGO_CVI_MPI_SHA" \
            /Makefile.param /include/ /sample/common/ /component/panel/cv181x/ \
            /modules/sys/ /modules/venc/ /modules/vdec/ /modules/vi/ /modules/vpss/ /modules/vo/ \
            /modules/gdc/ /modules/rgn/ /modules/bin/include/ /modules/isp/include/cv181x/ \
            /modules/ive/include/ /3rdparty/inih/
          sparse_fetch "$RUNNER_TEMP/osdrv-uapi" https://github.com/sophgo/osdrv.git \
            "$SOPHGO_OSDRV_SHA" /interdrv/include/
          sparse_fetch "$RUNNER_TEMP/sensor-list" https://github.com/sophgo/SensorSupportList.git \
            "$SOPHGO_SENSOR_LIST_SHA" /common/
          sparse_fetch "$RUNNER_TEMP/sdk-ion" https://github.com/sipeed/LicheeRV-Nano-Build.git \
            "$LICHEERV_NANO_SDK_SHA" /linux_5.10/drivers/staging/android/uapi/
          patch -d "$RUNNER_TEMP/cvi_mpi" -p1 --forward --fuzz=0 \
            < support/sg2002/middleware-patches/cvi-mpi-ebaaf1b-no-vi-dbg-thread.patch
          ! grep -q vi_dbg_handler "$RUNNER_TEMP/cvi_mpi/modules/vi/src/cvi_vi.c"

      # Replaces MaixCDK's prebuilt libsys/libvenc/libvdec/libvpu/libini, so libkvm_mmf.so links
      # against these and the image ships them. libvpu is split into libvi/libvpss/libvo/libgdc/
      # librgn; together they must keep every export of the old prebuilts.
      # Same toolchain as the MaixCDK build below, which reuses the fetched copy.
      - name: Build the Sophgo middleware from source
        run: |
          OUT="$GITHUB_WORKSPACE/build/native-libkvm/middleware"
          TOOLCHAIN_BIN="$(scripts/fetch-maixcdk-toolchain.sh "$HOME/MaixCDK")"
          SDK_MIDDLEWARE_OPT_FLAGS=-O2 scripts/build-sdk-middleware.sh "$RUNNER_TEMP/cvi_mpi" \
            "$RUNNER_TEMP/osdrv-uapi" "$RUNNER_TEMP/sdk-ion" "$OUT" \
            "$TOOLCHAIN_BIN" server-rust/native/dl_lib
          MW_LIB="$HOME/MaixCDK/components/3rd_party/sophgo-middleware/sophgo-middleware/v2/lib"
          cp "$OUT/libsys.so" "$OUT/libvenc.so" "$OUT/libvdec.so" "$OUT/libvi.so" "$OUT/libvpss.so" \
            "$OUT/libvo.so" "$OUT/libgdc.so" "$OUT/librgn.so" "$MW_LIB/"
          cp "$OUT/libini.so" "$MW_LIB/3rd/"

      # kvm_mmf compiles against these headers and sample code, so they must match the libraries
      # above. The LT6911 sensor headers stay MaixCDK's; ./build adds our sample_common_sensor.c.
      - name: Replace MaixCDK's middleware headers with the cvi_mpi ones
        run: |
          MPI="$RUNNER_TEMP/cvi_mpi"
          UAPI="$RUNNER_TEMP/osdrv-uapi/interdrv/include"
          MW="$HOME/MaixCDK/components/3rd_party/sophgo-middleware/sophgo-middleware/v2"
          rm -rf "$MW/include" "$MW/sample/common" "$MW/uapi" "$MW/modules/ive/include" \
            "$MW/component/panel/cv181x"
          cp -r "$MPI/include" "$MW/include"
          mkdir -p "$MW/include/isp/cv181x" "$MW/uapi/linux" "$MW/modules/ive"
          cp "$MPI"/modules/isp/include/cv181x/*.h "$MW/include/isp/cv181x/"
          cp -r "$MPI/sample/common" "$MW/sample/common"
          cp "$UAPI"/common/uapi/linux/*.h "$UAPI"/chip/cv181x/uapi/linux/*.h "$MW/uapi/linux/"
          cp -r "$MPI/modules/ive/include" "$MW/modules/ive/include"
          cp -r "$MPI/component/panel/cv181x" "$MW/component/panel/cv181x"
          grep -q "define MO_TBL_SIZE 2048" "$MW/uapi/linux/vi_uapi.h"
          mkdir -p "$MW/component/isp/common"
          cp "$RUNNER_TEMP"/sensor-list/common/sensor_list.[ch] "$MW/component/isp/common/"
          # Sensor names come from sensor_list.c, indexed by its own enum: the override must not
          # carry a table of its own.
          ! grep -q "snsr_type_name\[SAMPLE_SNS_TYPE_BUTT\] =" \
            support/sg2002/additional/sophgo-middleware/v2/sample/common/sample_common_sensor.c
          # Sophgo's name table has drifted from its enum before: check LT6911's slot.
          cat > "$RUNNER_TEMP/lt6911.c" <<'EOF'
          #include <string.h>
          #include "sensor_list.h"
          int main(void)
          {
          	const char *n = snsr_type_name[LONTIUM_LT6911_2M_60FPS_8BIT];

          	return !n || strcmp(n, "LONTIUM_LT6911_2M_60FPS_8BIT") != 0;
          }
          EOF
          gcc -DARCH_CV181X -D__CV181X__ -I"$MW/include" -I"$MW/include/isp/cv181x" -I"$MW/uapi" \
            -I"$MW/component/isp/common" "$RUNNER_TEMP/lt6911.c" \
            "$MW/component/isp/common/sensor_list.c" -o "$RUNNER_TEMP/lt6911"
          "$RUNNER_TEMP/lt6911"

      # ./build's own first-time logic (no $MAIXCDK_PATH/components/kvm yet, always true on this
      # fresh clone) copies support/sg2002/additional/{kvm,kvm_mmf,vision,peripheral bits} into
      # MaixCDK and answers its interactive platform prompt with "2" (maixcam) via heredoc -- the
      # exact sequence upstream's own docker/Dockerfile uses for `./build kvm_system`.
      - name: Build libkvm.so + libkvm_mmf.so via MaixCDK
        run: |
          cd "$GITHUB_WORKSPACE/support/sg2002"

          # The sources must carry the native changes this image relies on.
          grep -q "no stale sys state to release" additional/kvm_mmf/src/kvm_mmf.cpp
          grep -q "mmf_vi_frame_release" additional/kvm_mmf/src/kvm_mmf.cpp
          grep -q "kvmv_hdmi_signal_active" additional/kvm/src/kvm_vision.cpp
          grep -q "fresh_frame_count" additional/kvm/src/kvm_vision.cpp

          ./build kvm_vision

          DL_LIB="$GITHUB_WORKSPACE/support/sg2002/kvm_vision_test/dist/kvm_vision_test_release/dl_lib"
          test -s "$DL_LIB/libkvm.so"
          test -s "$DL_LIB/libkvm_mmf.so"
          file "$DL_LIB/libkvm.so" "$DL_LIB/libkvm_mmf.so"

          mkdir -p "$GITHUB_WORKSPACE/build/native-libkvm"
          cp "$DL_LIB/libkvm.so" "$DL_LIB/libkvm_mmf.so" "$GITHUB_WORKSPACE/build/native-libkvm/"

      # Reuses the MaixCDK components the libkvm build just installed.
      - name: Build kvm_system via MaixCDK
        run: |
          cd "$GITHUB_WORKSPACE/support/sg2002"

          # The VI state reader that pairs with libkvm's shared state writer.
          grep -q "vi_state_shared::read_state" kvm_system/main/lib/system_state/system_state.cpp

          ./build kvm_system

          BIN="$GITHUB_WORKSPACE/support/sg2002/kvm_system/dist/kvm_system_release/kvm_system"
          test -s "$BIN"
          file "$BIN"
          cp "$BIN" "$GITHUB_WORKSPACE/build/native-libkvm/kvm_system"

      # MaixCDK's CMake build embeds a build-host RPATH (e.g.
      # /home/runner/NanoKVM/support/sg2002/kvm_vision_test/build/kvm_mmf) into libkvm.so by
      # default -- register_component(DYNAMIC) doesn't set CMAKE_SKIP_RPATH. scripts/package-
      # rust-kvmapp.sh hard-fails on any RPATH/RUNPATH in these two libraries (a real portability/
      # security check, not something to work around by disabling it), so strip it here instead,
      # the same way the previously-published binaries must have been prepared.
      - name: Strip build-host RPATH from libkvm.so + libkvm_mmf.so + kvm_system
        run: |
          for lib in libkvm.so libkvm_mmf.so kvm_system; do
            LIB="$GITHUB_WORKSPACE/build/native-libkvm/$lib"
            if patchelf --print-rpath "$LIB" | grep -q .; then
              patchelf --remove-rpath "$LIB"
              echo "removed RPATH from $lib"
            else
              echo "$lib has no RPATH; nothing to strip"
            fi
          done

      # Matches server-rust/native/README.md's "libkvm.so: removed video NEEDED entry" finding
      # (symbol-table analysis found zero real call path into video/dnn/calib3d/features2d/flann;
      # this fresh build is a different compile of the same MaixCDK link-everything convention, not
      # a different call graph) -- but re-checked, not assumed, since this build's dependency set
      # could legitimately differ. Skips cleanly if the NEEDED entry isn't there at all.
      - name: Re-trim libkvm.so's unused OpenCV NEEDED entries
        run: |
          LIBKVM="$GITHUB_WORKSPACE/build/native-libkvm/libkvm.so"
          if patchelf --print-needed "$LIBKVM" | grep -q '^libopencv_video\.so\.409$'; then
            patchelf --remove-needed libopencv_video.so.409 "$LIBKVM"
            echo "removed libopencv_video.so.409 NEEDED entry"
          else
            echo "libopencv_video.so.409 not NEEDED by this build; nothing to trim"
          fi

      # kvm_system must run with only what the image already has.
      - name: Check kvm_system's loader and libraries
        run: |
          BIN="$GITHUB_WORKSPACE/build/native-libkvm/kvm_system"
          readelf -l "$BIN" | grep -q "interpreter: /lib/ld-musl-riscv64xthead.so.1"
          ! readelf -A "$BIN" | grep -q v0p7
          for lib in $(patchelf --print-needed "$BIN"); do
            case "$lib" in
              libstdc++.so.6|libgcc_s.so.1|libc.so) ;;
              *) echo "unexpected NEEDED entry in kvm_system: $lib" >&2; exit 1 ;;
            esac
          done

      # The build-image job downloads this by name -- this is the actual handoff, not just a
      # diagnostic copy (kept separate from actions/cache deliberately; see that job's download
      # step for why).
      - name: Upload native libkvm build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-libkvm-build
          path: build/native-libkvm/**
          retention-days: 14
          if-no-files-found: warn

  # Split out of build-image: a failure in the modules or the image no longer rebuilds the kernel,
  # and "re-run failed jobs" reuses these artifacts.
  build-kernel:
    needs: [vendor-sdk-source]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_ROOT: ${{ github.workspace }}/build/rc12-run
      EXPECTED_KERNEL_RELEASE: 5.10.265-tag-
      HARDENED_SG2002_VENDOR_SDK_DIR: ${{ github.workspace }}/build/vendor/LicheeRV-Nano-Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip rsync bc cpio \
            libncurses-dev python3 perl bison flex device-tree-compiler \
            dosfstools mtools file libssl-dev pkg-config e2fsprogs \
            u-boot-tools zstd

      - name: Download vendor SDK source
        uses: actions/download-artifact@v4
        with:
          name: vendor-sdk-source
          path: ${{ runner.temp }}/vendor-sdk-source

      - name: Unpack vendor SDK source
        run: |
          mkdir -p build
          tar -I zstd -xf "$RUNNER_TEMP/vendor-sdk-source/vendor-sdk-source.tar.zst" -C build
          rm -f "$RUNNER_TEMP/vendor-sdk-source/vendor-sdk-source.tar.zst"
          test -d "$HARDENED_SG2002_VENDOR_SDK_DIR" || {
            echo "vendor SDK missing after unpack: $HARDENED_SG2002_VENDOR_SDK_DIR" >&2
            exit 1
          }
          df -h /

      # Rehydrating the hardened kernel needs real history from the upstream stable tree (not just
      # two tag tips) to merge the vendor's 5.10.4 snapshot with 5.10.265. Not cached: at ~3 GB per
      # branch it evicted the other caches, and the clone takes only a few minutes.
      - name: Clone Linux stable kernel history
        run: |
          git clone --single-branch --branch linux-5.10.y \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            build/latestbuildroot/kernel-stable-5.10-rehydrate
          actual_5_10_4="$(git -C build/latestbuildroot/kernel-stable-5.10-rehydrate rev-parse 'v5.10.4^{}')"
          actual_5_10_265="$(git -C build/latestbuildroot/kernel-stable-5.10-rehydrate rev-parse 'v5.10.265^{}')"
          [ "$actual_5_10_4" = "$STABLE_5_10_4_COMMIT" ] || {
            echo "v5.10.4 commit mismatch: got $actual_5_10_4" >&2
            exit 1
          }
          [ "$actual_5_10_265" = "$STABLE_5_10_265_COMMIT" ] || {
            echo "v5.10.265 commit mismatch: got $actual_5_10_265" >&2
            exit 1
          }

      # Fast/local given the clone above; never cached, since the result is a worktree of that same
      # clone and would desync if cached separately.
      - name: Rehydrate the hardened 5.10.265 kernel source
        run: scripts/rehydrate-vendor-kernel-5.10.265-merge.sh

      # hardened-sg2002-vendor-runtime.mk declares its inputs PROPRIETARY/REDISTRIBUTE=NO, so the
      # steps below build every one of those inputs from source or this pipeline's own
      # vendor-sdk-stock build, rather than shipping an opaque prebuilt bundle.
      - name: Build the hardened 5.10.265 kernel candidate
        run: |
          KERNEL_5_10_265_OUTPUT_DIR="$RUN_ROOT/kernel" \
          KERNEL_5_10_265_CONFIG_FRAGMENT="support/sg2002/kernel/5.10.265/configs/phase4-01-no-ion.config" \
            scripts/build-vendor-kernel-5.10.265-candidate.sh

      # Tarred because artifacts drop permissions, symlinks and sub-second mtimes. The module builds
      # need both trees back at these same absolute paths.
      - name: Package the kernel source and build tree for build-modules
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-build"
          tar --format=posix -I 'zstd -T0 -3' \
            -cf "$RUNNER_TEMP/kernel-build/kernel-build.tar.zst" \
            build/rc12-run/kernel build/latestbuildroot/kernel-5.10.265-v1
          ls -l "$RUNNER_TEMP/kernel-build"
          df -h /

      - name: Upload kernel build tree
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: ${{ runner.temp }}/kernel-build/kernel-build.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      # The boot FIT only needs these three files.
      - name: Package the boot inputs for build-image
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-boot"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/kernel-boot/kernel-boot.tar.zst" \
            build/rc12-run/kernel/arch/riscv/boot/Image \
            build/rc12-run/kernel/arch/riscv/boot/dts/cvitek/sg2002_licheervnano_sd.dtb \
            build/rc12-run/kernel/include/generated/utsrelease.h

      - name: Upload kernel boot inputs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-boot
          path: ${{ runner.temp }}/kernel-boot/kernel-boot.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  # Split out of build-image for the same reason as build-kernel. Produces the finished
  # /mnt/system/ko tree (the modules in the three manifests, plus provenance records).
  build-modules:
    needs: [vendor-sdk-source, build-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_ROOT: ${{ github.workspace }}/build/rc12-run
      EXPECTED_KERNEL_RELEASE: 5.10.265-tag-
      HARDENED_SG2002_VENDOR_SDK_DIR: ${{ github.workspace }}/build/vendor/LicheeRV-Nano-Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip rsync bc cpio \
            libncurses-dev python3 perl bison flex device-tree-compiler \
            dosfstools mtools file libssl-dev pkg-config e2fsprogs \
            u-boot-tools zstd

      - name: Download vendor SDK source
        uses: actions/download-artifact@v4
        with:
          name: vendor-sdk-source
          path: ${{ runner.temp }}/vendor-sdk-source

      - name: Unpack vendor SDK source
        run: |
          mkdir -p build
          tar -I zstd -xf "$RUNNER_TEMP/vendor-sdk-source/vendor-sdk-source.tar.zst" -C build
          rm -f "$RUNNER_TEMP/vendor-sdk-source/vendor-sdk-source.tar.zst"
          test -d "$HARDENED_SG2002_VENDOR_SDK_DIR" || {
            echo "vendor SDK missing after unpack: $HARDENED_SG2002_VENDOR_SDK_DIR" >&2
            exit 1
          }
          df -h /

      - name: Download kernel build tree
        uses: actions/download-artifact@v4
        with:
          name: kernel-build
          path: ${{ runner.temp }}/kernel-build

      - name: Unpack kernel build tree
        run: |
          tar -I zstd -xf "$RUNNER_TEMP/kernel-build/kernel-build.tar.zst" -C "$GITHUB_WORKSPACE"
          rm -f "$RUNNER_TEMP/kernel-build/kernel-build.tar.zst"
          test -f "$RUN_ROOT/kernel/include/generated/utsrelease.h"
          df -h /

      # /mnt/system/ko's tree structure (which modules nest under 3rd/) is already fully
      # known from the tracked manifests, and the module-rebuild scripts already place their own
      # artifacts at these same relative paths -- no image to extract it from is needed. Placeholder
      # files here just give "Substitute freshly-built modules" below something to
      # find-and-overwrite; every one gets replaced.
      #
      # The vendor SDK's own /mnt/system also carries auto.sh and sdk-release: confirmed dead (zero
      # references anywhere in tracked source, auto.sh is generic unused vendor EVB boilerplate) and
      # not reproduced here.
      - name: Build the /mnt/system/ko skeleton from tracked manifests
        run: |
          KO_DIR="$RUN_ROOT/runtime/system/ko"
          mkdir -p "$KO_DIR/3rd"
          while IFS= read -r relative; do
            touch "$KO_DIR/$relative"
          done < support/sg2002/kernel/5.10.265/manifests/external-modules.txt
          while IFS= read -r relative; do
            touch "$KO_DIR/$(basename "$relative")"
          done < support/sg2002/kernel/5.10.265/manifests/in-tree-modules.txt
          while IFS= read -r module; do
            touch "$KO_DIR/$module"
          done < support/sg2002/kernel/5.10.265/manifests/media-modules.txt
          [ "$(find "$KO_DIR" -name '*.ko' | wc -l)" -eq "$(scripts/expected-module-count.sh)" ]

      - name: Fetch public sophgo/osdrv source
        run: |
          OSDRV="$RUN_ROOT/sophgo-osdrv"
          git init -q "$OSDRV"
          git -C "$OSDRV" remote add origin https://github.com/sophgo/osdrv.git
          git -C "$OSDRV" sparse-checkout set --no-cone /Makefile /interdrv/
          git -C "$OSDRV" fetch -q --depth 1 --filter=blob:none origin "$SOPHGO_OSDRV_SHA"
          git -C "$OSDRV" checkout -q FETCH_HEAD
          [ "$(git -C "$OSDRV" rev-parse HEAD)" = "$SOPHGO_OSDRV_SHA" ]

      # Rebuild the CVITEK osdrv external kernel modules from source, plus the media modules.
      # List: external-modules.txt -- the "soph_*" peripheral modules plus WiFi/Bluetooth/touch
      # drivers under 3rd/. interdrv/ (video, codec and the rest) comes from sophgo/osdrv at
      # SOPHGO_OSDRV_SHA with our patches; extdrv/ (3rd/) from the vendor SDK.
      #
      # rebuild-vendor-external-modules-5.10-baseline.sh only reads the manifest's
      # name/classification columns. RUNTIME_MODULE_DIR is just the empty skeleton built above --
      # its "accepted_sha256" column is a placeholder, not a real comparison; candidate mode never
      # gates on it, only on inventory and vermagic.
      - name: Rebuild external CVITEK kernel modules from source
        run: |
          MANIFEST_DIR=/tmp/module-provenance/report
          mkdir -p "$MANIFEST_DIR"
          {
            printf 'module\tclassification\n'
            sed 's/$/\trebuilt-vendor-module/' \
              support/sg2002/kernel/5.10.265/manifests/external-modules.txt
          } > "$MANIFEST_DIR/module-provenance.tsv"
          MODULE_PROVENANCE_DIR=/tmp/module-provenance \
          VENDOR_MODULE_SOURCE_DIR="$RUN_ROOT/runtime/system/ko" \
          KERNEL_BASELINE_OUTPUT_DIR="$RUN_ROOT/kernel" \
          EXTERNAL_MODULE_BASELINE_OUTPUT_DIR="$RUN_ROOT/external-modules" \
          EXPECTED_KERNEL_RELEASE="$EXPECTED_KERNEL_RELEASE" \
          SOPHGO_OSDRV_DIR="$RUN_ROOT/sophgo-osdrv" \
            scripts/rebuild-vendor-external-modules-5.10-baseline.sh
          # VI, VPSS, VENC and base must share one struct cvi_buffer layout.
          grep -q "define MO_TBL_SIZE 2048" \
            "$RUN_ROOT/external-modules/osdrv/interdrv/include/common/kapi/base_ctx.h"
          strings "$RUN_ROOT/external-modules/artifacts/soph_mipi_rx.ko" > "$RUNNER_TEMP/mipi_rx.strings"
          grep -qx lt_int "$RUNNER_TEMP/mipi_rx.strings"

      # Fill in the skeleton with what was just rebuilt from source (external, media and
      # in-tree) -- every module in the final image ships from source; see
      # server-rust/native/README.md for the full provenance trail.
      #
      # Must overwrite by existing path, not $KO_DIR/$(basename): the tree nests WiFi/BT/touch
      # modules under ko/3rd/, and basename-only copies would silently duplicate them
      # instead of overwriting the skeleton placeholder in place.
      - name: Substitute freshly-built modules into the runtime staging dir
        run: |
          KO_DIR="$RUN_ROOT/runtime/system/ko"

          replace_by_basename() {
            src="$1"
            name="$(basename "$src")"
            mapfile -t destinations < <(find "$KO_DIR" -type f -name "$name" -printf '%P\n')
            if [ "${#destinations[@]}" -ne 1 ]; then
              echo "expected exactly one skeleton placeholder named $name, found ${#destinations[@]}" >&2
              exit 1
            fi
            cp "$src" "$KO_DIR/${destinations[0]}"
          }

          find "$RUN_ROOT/external-modules/artifacts" -type f -name '*.ko' -print0 | \
            while IFS= read -r -d '' ko; do replace_by_basename "$ko"; done
          find "$RUN_ROOT/kernel" -type f -name '*.ko' -print0 | \
            while IFS= read -r -d '' ko; do replace_by_basename "$ko"; done
          for media in soph_vcodec.ko soph_jpeg.ko soph_vc_driver.ko; do
            replace_by_basename "$RUN_ROOT/external-modules/media-artifacts/$media"
          done

          [ "$(find "$KO_DIR" -name '*.ko' | wc -l)" -eq "$(scripts/expected-module-count.sh)" ]

      # Generated fresh from values already known at this point in the build, rather than carried
      # forward from any prebuilt image. device_acceptance must be exactly pending-recovery-sd --
      # build-latest-buildroot-kernel-5.10.265-rootfs.sh overrides the validator's own default to
      # this literal when it calls it, since this specific rebuild hasn't been through physical
      # device acceptance testing and shouldn't claim otherwise.
      #
      # hardened-kernel-5.10.265-provenance.txt is a second, separate file the same wrapper's
      # EXPECTED_RUNTIME_KERNEL_RELEASE override checks for
      # (validate-latest-buildroot-sg2002-rootfs.sh).
      #
      # sophgo_osdrv_commit is read back from the module rebuild's own report rather than
      # repeated here as a second literal copy.
      - name: Regenerate the kernel and media-module provenance records
        run: |
          KO_DIR="$RUN_ROOT/runtime/system/ko"
          kernel_release="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"$/\1/p' \
            "$RUN_ROOT/kernel/include/generated/utsrelease.h")"
          read -r kernel_source_commit < "$RUN_ROOT/kernel/report/source-commit.txt"
          read -r sophgo_osdrv_commit < "$RUN_ROOT/external-modules/report/sophgo-osdrv-commit.txt"
          cat > "$KO_DIR/hardened-source-media-provenance.txt" <<EOF
          kernel_release=$kernel_release
          sophgo_osdrv_commit=$sophgo_osdrv_commit
          soph_vcodec_sha256=$(sha256sum "$KO_DIR/soph_vcodec.ko" | awk '{print $1}')
          soph_jpeg_sha256=$(sha256sum "$KO_DIR/soph_jpeg.ko" | awk '{print $1}')
          soph_vc_driver_sha256=$(sha256sum "$KO_DIR/soph_vc_driver.ko" | awk '{print $1}')
          device_acceptance=pending-recovery-sd
          redistribution=disabled-pending-license-grant
          EOF
          cat > "$KO_DIR/hardened-kernel-5.10.265-provenance.txt" <<EOF
          kernel_release=$kernel_release
          kernel_source_commit=$kernel_source_commit
          in_tree_modules=24
          external_modules=30
          media_modules=3
          redistribution=disabled-pending-license-grant
          EOF

      # depmod exits 0 on an unresolved symbol and only warns, so its output is matched explicitly.
      - name: Check the module set against the kernel (vermagic and symbol resolution)
        run: |
          KO_DIR="$RUN_ROOT/runtime/system/ko"
          kernel_release="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"$/\1/p' \
            "$RUN_ROOT/kernel/include/generated/utsrelease.h")"
          DEPMOD_ROOT="$RUN_ROOT/depmod-root"
          DEPMOD_MODULE_DIR="$DEPMOD_ROOT/lib/modules/$kernel_release"
          mkdir -p "$DEPMOD_MODULE_DIR"
          while IFS= read -r module; do
            case "$(modinfo -F vermagic "$module" | tr '\r\n' ' ')" in
              "$kernel_release "*) ;;
              *)
                echo "vermagic does not match $kernel_release: $module" >&2
                exit 1
                ;;
            esac
            cp "$module" "$DEPMOD_MODULE_DIR/$(basename "$module")"
          done < <(find "$KO_DIR" -type f -name '*.ko' | LC_ALL=C sort)
          [ "$(find "$DEPMOD_MODULE_DIR" -name '*.ko' | wc -l)" -eq "$(scripts/expected-module-count.sh)" ]
          depmod -e -F "$RUN_ROOT/kernel/System.map" -b "$DEPMOD_ROOT" "$kernel_release" \
            2> "$RUN_ROOT/depmod.stderr" || { cat "$RUN_ROOT/depmod.stderr" >&2; exit 1; }
          if grep -nE 'needs unknown symbol|disagrees about version|not an ELF' "$RUN_ROOT/depmod.stderr"; then
            exit 1
          fi
          echo "kernel_release=$kernel_release: $(scripts/expected-module-count.sh) modules, vermagic and symbols OK"

      - name: Upload module-rebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-module-rebuild-report
          path: |
            build/rc12-run/external-modules/report/**
            /tmp/module-provenance/**
          retention-days: 14
          if-no-files-found: warn

      - name: Package the module tree for build-image
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-modules"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/kernel-modules/kernel-modules.tar.zst" \
            build/rc12-run/runtime/system/ko

      - name: Upload kernel modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: ${{ runner.temp }}/kernel-modules/kernel-modules.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  build-image:
    needs: [vendor-sdk, build-native-libkvm, build-kernel, build-modules]
    runs-on: ubuntu-latest
    # 360 minutes is the hard cap on GitHub-hosted runners. If this pipeline doesn't fit, the only
    # fix is a self-hosted runner, not a bigger number.
    timeout-minutes: 360
    env:
      RUN_ROOT: ${{ github.workspace }}/build/rc12-run
      EXPECTED_SYSTEM_VERSION: 0.4.0
      EXPECTED_KVMAPP_VERSION: 2.1.0
      EXPECTED_KERNEL_RELEASE: 5.10.265-tag-
      EXPECTED_SECURITY_PATCH_LEVEL: Buildroot 2026.05.1 security maintenance Linux 5.10.265 SG2002 vendor port
      NANOKVM_KVMAPP_SOURCE_DIR: ${{ github.workspace }}/build/kvmapp-rust/kvmapp
      HARDENED_SG2002_VENDOR_SDK_DIR: ${{ github.workspace }}/build/vendor/LicheeRV-Nano-Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip rsync bc cpio \
            libncurses-dev python3 perl bison flex device-tree-compiler \
            dosfstools mtools file libssl-dev pkg-config e2fsprogs \
            u-boot-tools zstd

      # Pinned: the runner's moving `stable` changed the link behaviour once already.
      - name: Install Rust ${{ env.RUST_VERSION }} with the riscv64gc-unknown-linux-musl target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target riscv64gc-unknown-linux-musl
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Enable Corepack
        run: corepack enable

      - name: Download vendor SDK
        uses: actions/download-artifact@v4
        with:
          name: vendor-sdk
          path: ${{ runner.temp }}/vendor-sdk

      - name: Unpack vendor SDK
        run: |
          mkdir -p build
          tar -I zstd -xf "$RUNNER_TEMP/vendor-sdk/vendor-sdk.tar.zst" -C build
          rm -f "$RUNNER_TEMP/vendor-sdk/vendor-sdk.tar.zst"
          test -d "$HARDENED_SG2002_VENDOR_SDK_DIR" || {
            echo "vendor SDK missing after unpack: $HARDENED_SG2002_VENDOR_SDK_DIR" >&2
            exit 1
          }
          df -h /

      # Artifact, not actions/cache: cache entries can be evicted between jobs of the same run.
      - name: Download native libkvm build
        uses: actions/download-artifact@v4
        with:
          name: native-libkvm-build
          path: build/native-libkvm

      - name: Cache Buildroot source download
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: buildroot-${{ env.BUILDROOT_VERSION }}

      # prepare-buildroot-2026.05.1-security-source.sh needs a pre-existing shared dl/ dir. Cached
      # at a standalone path rather than nested under the plain bootstrap tree: restoring there
      # first would leave an invalid, Buildroot-tree-less probe source that
      # bootstrap-latest-buildroot-probe.sh then refuses to extract into. BUILDROOT_SECURITY_DL_DIR
      # below points at this path independently, avoiding that collision regardless of cache restore
      # order.
      - name: Cache shared Buildroot package download directory
        uses: actions/cache@v4
        with:
          path: build/buildroot-package-dl-cache
          # v2: bumped after moving off the colliding nested path above.
          key: buildroot-dl-v2-${{ env.BUILDROOT_VERSION }}

      - name: Bootstrap Buildroot + security-patched source
        run: |
          mkdir -p build/buildroot-package-dl-cache
          make latest-buildroot-bootstrap
          BUILDROOT_SECURITY_DL_DIR="${{ github.workspace }}/build/buildroot-package-dl-cache" \
            make latest-buildroot-security-source

      # build-linked-libkvm.sh links against a real NanoKVM musl libc.so/libgcc_s.so;
      # server-rust/sysroot/ is gitignored, so stage it from our own vendor-sdk-stock build (already
      # cached above) -- not sophgo/host-tools' bundled sysroot, which is a generic cross-toolchain
      # build confirmed elsewhere in this pipeline to not be the vendor's on-device runtime
      # (server-rust/native/README.md). Using vendor-sdk-stock here too means linking and runtime
      # both use the same verified files, not two different sources.
      - name: Stage NanoKVM runtime sysroot for linked libkvm build
        run: |
          scripts/extract-vendor-sdk-stock-file.sh server-rust/sysroot/lib/libc.so \
            /lib/libc.so /usr/lib/libc.so \
            /lib64xthead/lp64d/libc.so /lib64v0p7_xthead/lp64d/libc.so \
            /usr/lib64xthead/lp64d/libc.so /usr/lib64v0p7_xthead/lp64d/libc.so
          scripts/extract-vendor-sdk-stock-file.sh server-rust/sysroot/lib/libgcc_s.so.1 \
            /lib/libgcc_s.so.1 /usr/lib/libgcc_s.so.1 \
            /lib64xthead/lp64d/libgcc_s.so.1 /lib64v0p7_xthead/lp64d/libgcc_s.so.1

      # Overwrites the checked-in server-rust/native/dl_lib/ copies (which still carry app 2.0.42's
      # libkvm_mmf.so, with the LT6911 probe's dead code intact) with the build-native-libkvm job's
      # freshly-built ones for this run only -- git's own copies are left untouched. This is where
      # the LT6911 patch actually reaches the code that runs.
      - name: Use freshly-built libkvm.so, libkvm_mmf.so and middleware
        run: |
          cp build/native-libkvm/libkvm.so server-rust/native/dl_lib/libkvm.so
          cp build/native-libkvm/libkvm_mmf.so server-rust/native/dl_lib/libkvm_mmf.so
          for lib in libsys.so libvenc.so libvdec.so libvi.so libvpss.so libvo.so libgdc.so librgn.so \
            libini.so; do
            cp "build/native-libkvm/middleware/$lib" "server-rust/native/dl_lib/$lib"
          done
          # Split into libvi/libvpss/libvo/libgdc/librgn; the old prebuilt must not ship.
          rm server-rust/native/dl_lib/libvpu.so

      - name: Build Hardened kvmapp bridge
        run: |
          cargo test --manifest-path server-rust/Cargo.toml
          corepack pnpm --dir web install --frozen-lockfile
          corepack pnpm --dir web build
          server-rust/scripts/build-linked-libkvm.sh
          RUST_TARGET=riscv64gc-unknown-linux-musl \
            APP_VERSION="$(cat kvmapp/version)" \
            KVM_SYSTEM_SOURCE="$GITHUB_WORKSPACE/build/native-libkvm/kvm_system" \
            scripts/package-rust-kvmapp.sh

      # libc.so, the 4 GCC runtime libs, the 2 T-Head loaders, and libsns_lt6911.so all come from
      # this pipeline's own vendor-sdk-stock build (already cached above) -- the real on-device
      # image, not sophgo/host-tools' generic cross-toolchain sysroot (tried first and rejected; see
      # server-rust/native/README.md for the full evidence trail on all 8 files).
      #
      # None of these files live under /kvmapp/ in a stock image, so probe a few plausible paths
      # rather than assume one, and fail hard if any is missing. extract-vendor-sdk-stock-file.sh is
      # the same helper the earlier sysroot-staging step uses, so linking and runtime never diverge.
      - name: Source the remaining runtime files from our own vendor-sdk-stock build
        run: |
          RUNTIME_DIR="$RUN_ROOT/runtime"
          mkdir -p "$RUNTIME_DIR/loaders" "$RUNTIME_DIR/kvmapp-dl-lib" "$RUNTIME_DIR/system/usr/lib"

          scripts/extract-vendor-sdk-stock-file.sh "$RUNTIME_DIR/kvmapp-dl-lib/libc.so" \
            /lib/libc.so /usr/lib/libc.so \
            /lib64xthead/lp64d/libc.so /lib64v0p7_xthead/lp64d/libc.so \
            /usr/lib64xthead/lp64d/libc.so /usr/lib64v0p7_xthead/lp64d/libc.so
          scripts/extract-vendor-sdk-stock-file.sh \
            "$RUNTIME_DIR/kvmapp-dl-lib/libstdc++.so.6.0.28" \
            /lib/libstdc++.so.6.0.28 /usr/lib/libstdc++.so.6.0.28 \
            /lib64xthead/lp64d/libstdc++.so.6.0.28 /lib64v0p7_xthead/lp64d/libstdc++.so.6.0.28
          scripts/extract-vendor-sdk-stock-file.sh "$RUNTIME_DIR/kvmapp-dl-lib/libgcc_s.so.1" \
            /lib/libgcc_s.so.1 /usr/lib/libgcc_s.so.1 \
            /lib64xthead/lp64d/libgcc_s.so.1 /lib64v0p7_xthead/lp64d/libgcc_s.so.1
          scripts/extract-vendor-sdk-stock-file.sh "$RUNTIME_DIR/kvmapp-dl-lib/libgomp.so.1.0.0" \
            /lib/libgomp.so.1.0.0 /usr/lib/libgomp.so.1.0.0 \
            /lib64xthead/lp64d/libgomp.so.1.0.0 /lib64v0p7_xthead/lp64d/libgomp.so.1.0.0
          scripts/extract-vendor-sdk-stock-file.sh "$RUNTIME_DIR/kvmapp-dl-lib/libatomic.so.1.2.0" \
            /lib/libatomic.so.1.2.0 /usr/lib/libatomic.so.1.2.0 \
            /lib64xthead/lp64d/libatomic.so.1.2.0 /lib64v0p7_xthead/lp64d/libatomic.so.1.2.0
          scripts/extract-vendor-sdk-stock-file.sh \
            "$RUNTIME_DIR/loaders/ld-musl-riscv64xthead.so.1" /lib/ld-musl-riscv64xthead.so.1
          scripts/extract-vendor-sdk-stock-file.sh "$RUNTIME_DIR/system/usr/lib/libsns_lt6911.so" \
            /mnt/system/usr/lib/libsns_lt6911.so

      # libkvm.so doesn't need video/dnn/calib3d/features2d/flann/protobuf
      # (server-rust/native/README.md); those are deleted regardless of what's staged here. That
      # leaves core/highgui/imgcodecs/imgproc -- source those from real upstream (GPL-3.0
      # sipeed/NanoKVM), verified near-byte-identical (same MaixCDK build).
      - name: Source OpenCV core/highgui/imgcodecs/imgproc from upstream
        run: |
          DL_LIB="$RUN_ROOT/runtime/kvmapp-dl-lib"
          verify_and_replace() {
            name="$1"
            expected_sha256="$2"
            curl --fail --location --retry 2 \
              --output "/tmp/$name" \
              "https://raw.githubusercontent.com/sipeed/NanoKVM/$NANOKVM_UPSTREAM_COMMIT/server/dl_lib/$name"
            echo "$expected_sha256  /tmp/$name" | sha256sum -c -
            cp "/tmp/$name" "$DL_LIB/$name"
          }
          verify_and_replace libopencv_core.so.409 "$NANOKVM_UPSTREAM_OPENCV_CORE_SHA256"
          verify_and_replace libopencv_highgui.so.409 "$NANOKVM_UPSTREAM_OPENCV_HIGHGUI_SHA256"
          verify_and_replace libopencv_imgcodecs.so.409 "$NANOKVM_UPSTREAM_OPENCV_IMGCODECS_SHA256"
          verify_and_replace libopencv_imgproc.so.409 "$NANOKVM_UPSTREAM_OPENCV_IMGPROC_SHA256"

      - name: Download kernel boot inputs
        uses: actions/download-artifact@v4
        with:
          name: kernel-boot
          path: ${{ runner.temp }}/kernel-boot

      - name: Download kernel modules
        uses: actions/download-artifact@v4
        with:
          name: kernel-modules
          path: ${{ runner.temp }}/kernel-modules

      - name: Unpack kernel boot inputs and modules
        run: |
          for name in kernel-boot kernel-modules; do
            tar -I zstd -xf "$RUNNER_TEMP/$name/$name.tar.zst" -C "$GITHUB_WORKSPACE"
          done
          test -f "$RUN_ROOT/kernel/arch/riscv/boot/Image"
          [ "$(find "$RUN_ROOT/runtime/system/ko" -name '*.ko' | wc -l)" -eq "$(scripts/expected-module-count.sh)" ]

      - name: Build the Buildroot rootfs with the hardened kernel modules
        run: |
          KERNEL_5_10_265_VENDOR_RUNTIME_DIR="$RUN_ROOT/runtime" \
          KERNEL_5_10_265_BUILDROOT_OUTPUT_DIR="$RUN_ROOT/buildroot" \
          KERNEL_5_10_265_ROOTFS_REPORT_DIR="$RUN_ROOT/_reports/rootfs" \
            scripts/build-latest-buildroot-kernel-5.10.265-rootfs.sh

      - name: Rebuild the vendor boot FIT image for the candidate kernel
        run: |
          KERNEL_BASELINE_OUTPUT_DIR="$RUN_ROOT/kernel" \
          BOOT_SD_BASELINE_OUTPUT_DIR="$RUN_ROOT/boot" \
          BOOT_SD_BUILD_MODE=candidate \
            scripts/rebuild-vendor-boot-sd-5.10-baseline.sh

      # Generic safety net, not gzip-specific diagnostics (that mtime bug is already fixed in
      # rebuild-vendor-boot-sd-5.10-baseline.sh).
      - name: Upload boot rebuild workspace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-rebuild-diagnostics
          path: |
            build/rc12-run/boot/**
          retention-days: 7
          if-no-files-found: warn

      # MCOPY's fallback default is for sudo-less hosts (e.g. WSL) that unpack mtools manually; we
      # install it via apt, so point at that.
      - name: Assemble the recovery-SD image
        run: |
          KERNEL_5_10_265_BUILDROOT_OUTPUT_DIR="$RUN_ROOT/buildroot" \
          KERNEL_5_10_265_VENDOR_RUNTIME_DIR="$RUN_ROOT/runtime" \
          KERNEL_5_10_265_BOOT_SD="$RUN_ROOT/boot/workspace/boot.itb" \
          KERNEL_5_10_265_RECOVERY_SD_DIR="$RUN_ROOT/recovery" \
          MCOPY="$(command -v mcopy)" \
            scripts/assemble-kernel-5.10.265-recovery-sd-image.sh

      # The unsigned raw update archive, plus a script that signs it with a local key anywhere
      # (see docs/guide/updates.md), so a device can be updated without an SD-card reflash.
      - name: Package the unsigned system-update archive
        run: |
          # the base version with the run number as its last part, so every build is newer than
          # the one before and can be uploaded and installed over it
          SYSTEM_VERSION="${EXPECTED_SYSTEM_VERSION%.*}.${{ github.run_number }}" \
          KERNEL_VERSION="$EXPECTED_KERNEL_RELEASE" \
          SECURITY_PATCH_LEVEL="$EXPECTED_SECURITY_PATCH_LEVEL" \
          BUILDROOT_VERSION="$BUILDROOT_VERSION" \
          REQUIRED_APP_VERSION=2.0.41 \
            scripts/package-local-system-update.sh \
            "$RUN_ROOT/recovery/assembly/images/hardened-sg2002-port.img" \
            "$RUN_ROOT/system-update"

      - name: Upload the system-update archive
        uses: actions/upload-artifact@v4
        with:
          name: system-update-archive
          path: build/rc12-run/system-update/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload recovery-SD image and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg2002-recovery-sd-image
          path: |
            build/rc12-run/recovery/**
            build/rc12-run/_reports/**
          retention-days: 14
          if-no-files-found: warn
