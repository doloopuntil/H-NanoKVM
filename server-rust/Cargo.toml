[package]
name = "nanokvm-rust-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = []
linked-libkvm = []

[dependencies]
argon2 = "0.6"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
base64 = "0.23"
bytes = "1"
cipher = "0.4"
# Already present in Cargo.lock as transitive dependencies of the webrtc/rcgen
# graph; promoted to direct dependencies for the TOTP implementation.
data-encoding = "2.11"
flate2 = "1"
hmac = "0.12"
# Already in Cargo.lock via axum; used directly to set a header timeout.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
getrandom = "0.4"
futures-util = { version = "0.3.32", features = ["sink"] }
nix = { version = "0.31.3", features = ["fs", "ioctl", "mount", "net", "process", "signal", "term"] }
rcgen = "0.14"
# Types webrtc takes from its sans-I/O core; pinned with webrtc.
rtc = { version = "=0.21.1", default-features = false }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha1 = "0.10"
sha2 = "0.11"
subtle = "2.6"
tar = "0.4"
thiserror = "2"
time = { version = "0.3.51", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
webrtc = "=0.21.1"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }

# musl's malloc is slow under the many small allocations of Tokio, hyper and rustls.
# Secure mode (guard pages, encoded free lists) costs under 1% CPU on MJPEG.
[target.'cfg(all(target_arch = "riscv64", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["secure"] }

[dev-dependencies]
# Host stand-ins for the vector TLS code (src/http/vector_aead.rs).
chacha20 = "0.10"
poly1305 = "0.8"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Video passes through these: TLS/WebSocket for Direct, SRTP for WebRTC. The rest
# stays at "z" because the binary runs from tmpfs.
[profile.release.package]
ring = { opt-level = 3 }
rustls = { opt-level = 3 }
tungstenite = { opt-level = 3 }
tokio-tungstenite = { opt-level = 3 }
rtc-srtp = { opt-level = 3 }
rtc-crypto = { opt-level = 3 }
aes = { opt-level = 3 }
ctr = { opt-level = 3 }
hmac = { opt-level = 3 }
sha1 = { opt-level = 3 }
mimalloc = { opt-level = 3 }
libmimalloc-sys = { opt-level = 3 }
